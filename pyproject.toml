[project]
name = "epiot"
version = "0.1.0"
description = "EPIOT - Drive2X WP5: short-term load forecasting for charge point operators and grid operators"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Stavros Orfanoudakis" },
    { name = "Babak Ravanbach" },
    { name = "Arellano Ruiz, Eugenio Salvador" },
]

dependencies = [
    # Web application
    "flask",
    "flask-alembic",
    "flask-sqlalchemy-lite",
    # Database / ORM
    "alembic",
    "sqlalchemy",
    "geoalchemy2",
    # Geospatial
    "geopandas",
    "shapely",
    "geojson",
    "folium",
    # Data handling
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scipy",
    # Misc
    "pyyaml",
    "requests",
    # Only used by scripts/install_spatialite.py to unpack the official
    # mod_spatialite bundle, which is distributed as a .7z archive.
    "py7zr; sys_platform == 'win32'",
    "holidays>=0.106",
    # WSGI server for production (see docs/operations.md)
    "gunicorn>=26.2.0; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://drive2x.eu/"
Repository = "https://github.com/StavrosOrf/EPIOT"
Documentation = "https://epiot.readthedocs.io/en/latest/"

[project.optional-dependencies]
# Load forecasting models in backend/ml. Kept separate because torch is a
# large download and the Flask app runs without it.
ml = [
    "torch",
    "scikit-learn",
]
# Existing CPFT checkpoints, evaluated with this Keras/TensorFlow combination.
cpft = [
    "tensorflow==2.20.0",
    "keras==3.13.2",
    "numpy>=1.26,<2.3",
]

[dependency-groups]
dev = [
    "pytest",
    "openpyxl",  # checkpoint/export reconciliation in the CPFT tests
]

[tool.uv]
# The repository is an application, not an installable library: uv only has to
# manage the environment, not build and install ./backend into it.
package = false
# OneDrive-synced checkouts reject the hardlinks uv uses to populate .venv from
# its cache ("cannot be performed on a file with incompatible hardlinks",
# os error 396), so copy the files in instead.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# OneDrive-synced checkouts deny the directory swap pytest uses to write its
# cache, so keep the cache out of the working tree.
addopts = "-p no:cacheprovider"
markers = [
    "reflex_live: opt-in external ReFlex optimisation (REFLEX_LIVE=1)",
]
